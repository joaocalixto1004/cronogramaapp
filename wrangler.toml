# Precisa bater com o nome do Worker na Cloudflare, senão o build avisa que
# houve divergência e abre um pull request automático para "corrigir".
name = "cronogramaapp"
main = "worker.js"
compatibility_date = "2026-08-01"

# O site sai de publico/, montado por build.sh — e não da raiz do repositório.
# Servir a raiz publicaria schema.sql, wrangler.toml, package.json e testes/.
[assets]
directory = "./publico"
binding = "ASSETS"

# Criar uma vez com:  npx wrangler@4 d1 create ritmo
# e colar o id devolvido aqui. Diferente do Pages, esta binding vale também
# em produção — não precisa repetir no painel.
[[d1_databases]]
binding       = "DB"
database_name = "ritmo"
database_id   = "85977e78-3a75-4e6a-a33c-5b0576817f83"
