<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assistente — Ritmo</title>
<meta name="description" content="Converse com os modelos de IA da NVIDIA, com histórico separado por tipo de tarefa.">
<meta name="theme-color" content="#12262F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="stylesheet" href="estilo.css">
<link rel="preload" href="fontes/plex-sans-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fontes/plex-mono-400.woff2" as="font" type="font/woff2" crossorigin>
<script type="module" src="ia-chat.js"></script>
</head>
<body>
<div class="wrap wrap-ia">

<header>
  <div class="brandrow">
    <h1 class="brand">Ritmo<span>.</span> <span class="eyebrow">assistente</span></h1>
    <div class="topo-acoes">
      <a class="ghost" href="./">cronograma</a>
    </div>
  </div>
</header>

<div class="ia-barra">
  <label class="eyebrow" for="iaTarefa">tarefa</label>
  <select id="iaTarefa">
    <option value="rapido">rápido — respostas curtas do dia a dia</option>
    <option value="geral">geral — perguntas abertas</option>
    <option value="codigo">código — programação</option>
    <option value="agente">agente — planejamento em etapas</option>
  </select>
  <button class="ghost" id="iaAbrirModelo" type="button">modelo: <span id="iaModeloAtual">automático</span></button>
  <button class="ghost" id="iaLimpar" type="button" title="Apaga o histórico desta tarefa">limpar</button>
</div>

<p class="ia-aviso" id="iaAviso" hidden></p>

<!-- escolha do modelo -->
<dialog id="dlgModelo"><form method="dialog" class="dlg">
  <span class="eyebrow">modelo</span>
  <h3>Qual modelo responde</h3>
  <p class="sub">"Automático" tenta o melhor da tarefa e troca sozinho se ele estiver sem
    cota ou fora do ar. Escolher um modelo específico usa só ele — sem substituto.</p>

  <ul class="modelos" id="listaModelos">
    <li>
      <label class="modelo-opcao">
        <input type="radio" name="modeloEscolha" value="">
        <span class="modelo-nome">Automático <small>recomendado</small></span>
      </label>
    </li>
    <li>
      <label class="modelo-opcao">
        <input type="radio" name="modeloEscolha" value="openai/gpt-oss-120b">
        <span class="modelo-nome">gpt-oss-120b <small>~0,4s · o mais rápido e estável</small></span>
      </label>
    </li>
    <li>
      <label class="modelo-opcao">
        <input type="radio" name="modeloEscolha" value="openai/gpt-oss-20b">
        <span class="modelo-nome">gpt-oss-20b <small>~0,4s · rede de segurança, sempre responde</small></span>
      </label>
    </li>
    <li>
      <label class="modelo-opcao">
        <input type="radio" name="modeloEscolha" value="nvidia/nemotron-3-super-120b-a12b">
        <span class="modelo-nome">nemotron-3-super <small>~0,6s · geral</small></span>
      </label>
    </li>
    <li>
      <label class="modelo-opcao">
        <input type="radio" name="modeloEscolha" value="minimaxai/minimax-m3">
        <span class="modelo-nome">minimax-m3 <small>~1,2s · programação</small></span>
      </label>
    </li>
    <li>
      <label class="modelo-opcao">
        <input type="radio" name="modeloEscolha" value="moonshotai/kimi-k3">
        <span class="modelo-nome">kimi-k3 <small>~2,1s · contexto longo, planejamento</small></span>
      </label>
    </li>
  </ul>

  <div class="acoes">
    <button class="btn sec" value="cancel" type="submit" formnovalidate>cancelar</button>
    <button class="btn" value="ok" type="submit">usar</button>
  </div>
</form></dialog>

<main class="ia-conversa" id="iaConversa" aria-live="polite">
  <p class="ia-vazio">Sem conversa ainda nesta tarefa.</p>
</main>

<form class="ia-forma" id="iaForma">
  <textarea id="iaEntrada" rows="1" placeholder="Escreva e pressione Enter…"></textarea>
  <button class="btn" id="iaEnviar" type="submit">Enviar</button>
</form>

</div>
</body>
</html>
